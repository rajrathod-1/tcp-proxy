name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Debug]
        compiler: [default]
        include:
          - os: ubuntu-latest
            build_type: Release
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      # The whole kit end to end: a backend, the proxy, and a short load test through it.
      - name: Load test through the proxy
        run: |
          build/echo-server --listen 127.0.0.1:9001 --threads 1 &
          build/tcp-proxy --listen 127.0.0.1:8000 --backend 127.0.0.1:9001 --workers 2 &
          sleep 1
          build/loadgen --target 127.0.0.1:8000 --mode rr --connections 32 --seconds 3 --threads 2 | tee load.txt
          grep -q "errors      0" load.txt

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPROXY_ENABLE_SANITIZERS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
